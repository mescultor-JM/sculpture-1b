<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>AR Sculpture</title>

  <!--
    model-viewer 4.3.1
    Official Google Model Viewer distribution
  -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
  ></script>

  <style>

    /* ==========================================
       PAGE
       ========================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    /* ==========================================
       3D VIEWER
       ========================================== */

    model-viewer {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background-color: #ffffff;

      /*
        Important for mobile interaction.

        Allows vertical page gestures while
        model-viewer handles its own gestures.
      */
      touch-action: pan-y;
    }


    /* ==========================================
       GENERAL MESSAGE
       ========================================== */

    .message {

      display: none;

      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: min(420px, 86vw);

      padding: 24px;

      background: #ffffff;

      border-radius: 16px;

      text-align: center;

      color: #222222;

      font-size: 14px;

      line-height: 1.5;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.20);

      z-index: 1000;
    }

    .message strong {
      font-size: 18px;
    }


    /* ==========================================
       ERROR
       ========================================== */

    #error-message {

      background: #ffebee;

      color: #b71c1c;
    }


    /* ==========================================
       AR INFORMATION
       ========================================== */

    #ar-info-message {

      background: #e3f2fd;

      color: #0d47a1;
    }


    /* ==========================================
       MESSAGE BUTTON
       ========================================== */

    .message-button {

      margin-top: 10px;

      padding: 10px 18px;

      border: 0;

      border-radius: 8px;

      color: #ffffff;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    .reload-button {
      background: #c62828;
    }


    .close-button {
      background: #0d47a1;
    }


    /* ==========================================
       BOTTOM UI
       ========================================== */

    #ui-layer {

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        20px
        20px
        calc(20px + env(safe-area-inset-bottom));

      z-index: 100;

      pointer-events: none;
    }


    /* ==========================================
       BUTTON CONTAINER
       ========================================== */

    .button-container {

      width: min(230px, 82vw);

      height: 64px;

      pointer-events: auto;
    }


    /* ==========================================
       MAIN BUTTON
       ========================================== */

    .action-button {

      width: 100%;
      height: 100%;

      border: 0;

      border-radius: 32px;

      outline: none;

      background:
        linear-gradient(
          135deg,
          #007aff 0%,
          #0055d4 100%
        );

      color: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      font-size: 18px;

      font-weight: 600;

      letter-spacing: 0.3px;

      cursor: pointer;

      box-shadow:
        0 8px 24px rgba(0, 122, 255, 0.30);

      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }


    .action-button:active {
      transform: scale(0.97);
    }


    .action-button:focus-visible {

      outline:
        3px solid rgba(0, 122, 255, 0.35);

      outline-offset: 4px;
    }


    .action-button svg {

      width: 22px;
      height: 22px;

      flex: 0 0 auto;

      fill: currentColor;
    }


    /* ==========================================
       LOADING
       ========================================== */

    .action-button.loading {

      background:
        linear-gradient(
          135deg,
          #34c759 0%,
          #248a3d 100%
        );

      pointer-events: none;
    }


    /* ==========================================
       3D ONLY
       ========================================== */

    .action-button.model-only {

      background:
        linear-gradient(
          135deg,
          #555555 0%,
          #222222 100%
        );

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.20);
    }


    /* ==========================================
       AR AVAILABLE
       ========================================== */

    @keyframes pulse {

      0% {
        box-shadow:
          0 8px 24px
          rgba(0, 122, 255, 0.25);
      }

      50% {
        box-shadow:
          0 8px 32px
          rgba(0, 122, 255, 0.60);
      }

      100% {
        box-shadow:
          0 8px 24px
          rgba(0, 122, 255, 0.25);
      }
    }


    .action-button.ar-available {

      animation:
        pulse 2.5s infinite;
    }


    /* ==========================================
       SPINNER
       ========================================== */

    .spinner {

      width: 20px;
      height: 20px;

      border:
        3px solid
        rgba(255, 255, 255, 0.35);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }
    }


    /* ==========================================
       DEBUG / FALLBACK NOTICE
       ========================================== */

    .environment-note {

      position: fixed;

      top: 12px;

      left: 50%;

      transform: translateX(-50%);

      width: max-content;

      max-width: 90vw;

      padding: 8px 14px;

      border-radius: 8px;

      background: #fff3cd;

      color: #856404;

      font-size: 13px;

      line-height: 1.4;

      text-align: center;

      z-index: 2000;
    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 480px) {

      .button-container {

        width: min(215px, 80vw);

        height: 60px;
      }

      .action-button {

        font-size: 17px;
      }
    }


    /* ==========================================
       REDUCED MOTION
       ========================================== */

    @media (prefers-reduced-motion: reduce) {

      .action-button {

        animation: none !important;

        transition: none;
      }
    }

  </style>

</head>


<body>


  <!-- ==========================================
       3D MODEL + AR
       ========================================== -->

  <model-viewer

    id="ar-model"

    src="./escultura.glb"

    ios-src="./escultura.usdz"

    alt="A 3D model of a sculpture"

    ar

    ar-modes="scene-viewer webxr quick-look"

    ar-placement="floor"

    ar-scale="auto"

    camera-controls

    touch-action="pan-y"

    shadow-intensity="1"

    exposure="1"

    environment-image="neutral"

    xr-environment

    loading="eager"

  >
  </model-viewer>


  <!-- ==========================================
       MODEL ERROR
       ========================================== -->

  <div
    id="error-message"
    class="message"
    role="alert"
  >

    <strong>
      3D Model Unavailable
    </strong>

    <br><br>

    <span id="error-text">
      The sculpture could not be loaded.
    </span>

    <br><br>

    <button
      id="reload-button"
      class="message-button reload-button"
      type="button"
    >
      Reload Page
    </button>

  </div>


  <!-- ==========================================
       AR INFORMATION
       ========================================== -->

  <div
    id="ar-info-message"
    class="message"
    role="alert"
  >

    <strong id="ar-info-title">
      AR Unavailable
    </strong>

    <br><br>

    <span id="ar-info-text">
      Augmented Reality is not available on this device.
    </span>

    <br><br>

    <em id="ar-info-footnote">
      You can still rotate and zoom the sculpture
      using the 3D viewer.
    </em>

    <br><br>

    <button
      id="close-info-button"
      class="message-button close-button"
      type="button"
    >
      Continue
    </button>

  </div>


  <!-- ==========================================
       ACTION BUTTON
       ========================================== -->

  <div id="ui-layer">

    <div class="button-container">

      <button
        id="action-button"
        class="action-button"
        type="button"
        aria-label="Loading 3D model"
      >

        <div class="spinner"></div>

        <span>
          Loading 3D...
        </span>

      </button>

    </div>

  </div>


  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->

  <script>

    (() => {

      "use strict";


      /* ========================================
         ELEMENTS
         ======================================== */

      const modelViewer =
        document.getElementById("ar-model");

      const actionButton =
        document.getElementById("action-button");

      const errorMessage =
        document.getElementById("error-message");

      const errorText =
        document.getElementById("error-text");

      const reloadButton =
        document.getElementById("reload-button");

      const arInfoMessage =
        document.getElementById("ar-info-message");

      const arInfoTitle =
        document.getElementById("ar-info-title");

      const arInfoText =
        document.getElementById("ar-info-text");

      const arInfoFootnote =
        document.getElementById("ar-info-footnote");

      const closeInfoButton =
        document.getElementById("close-info-button");


      /* ========================================
         DEVICE INFORMATION
         ======================================== */

      const ua =
        navigator.userAgent || "";

      const isAndroid =
        /Android/i.test(ua);

      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (
          navigator.platform === "MacIntel" &&
          navigator.maxTouchPoints > 1
        );


      /*
       * In-app browsers frequently have restrictions
       * around launching native AR experiences.
       */

      const isInAppBrowser =
        /\b(
          FBAN|
          FBAV|
          FB_IAB|
          Instagram|
          Line\/|
          WhatsApp|
          Twitter|
          MicroMessenger|
          GSA\/|
          ;\s*wv\)
        )\b/ix.test(ua);


      /* ========================================
         SECURITY
         ======================================== */

      const isSecure =
        window.isSecureContext === true;


      /* ========================================
         WEBGL
         ======================================== */

      const hasWebGL = (() => {

        try {

          const canvas =
            document.createElement("canvas");

          return !!(
            window.WebGLRenderingContext &&
            (
              canvas.getContext("webgl") ||
              canvas.getContext("experimental-webgl")
            )
          );

        } catch (error) {

          return false;
        }

      })();


      /* ========================================
         STATE
         ======================================== */

      let modelLoaded = false;

      let arAvailable = false;

      let arStarted = false;

      let capabilityTimer = null;

      let loadTimeout = null;


      /* ========================================
         ICONS
         ======================================== */

      const arIcon = `
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="
              M12 2
              C6.48 2 2 6.48 2 12
              s4.48 10 10 10
              10-4.48 10-10
              S17.52 2 12 2z

              m-1 17.93
              c-3.95-.49-7-3.85-7-7.93
              0-.62.08-1.21.21-1.79
              L9 15v1
              c0 1.1.9 2 2 2
              v1.93z

              m6.9-2.54
              c-.26-.81-1-1.39-1.9-1.39
              h-1v-3
              c0-.55-.45-1-1-1
              H8v-2h2
              c.55 0 1-.45 1-1
              V7h2
              c1.1 0 2-.9 2-2
              v-.41
              c2.93 1.19 5 4.06 5 7.41
              0 2.08-.8 3.97-2.1 5.39z
            "
          />
        </svg>
      `;


      const modelIcon = `
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="
              M12 2
              L3 7
              v10
              l9 5
              9-5
              V7
              l-9-5z

              m0 2.3
              L18.5 8
              12 11.7
              5.5 8
              12 4.3z

              M5 9.7
              l6 3.4
              v6.9
              l-6-3.3
              V9.7z

              m8 10.3
              v-6.9
              l6-3.4
              v7
              l-6 3.3z
            "
          />
        </svg>
      `;


      /* ========================================
         UI STATES
         ======================================== */

      function setLoading(label = "Loading 3D...") {

        actionButton.className =
          "action-button loading";

        actionButton.innerHTML = `
          <div class="spinner"></div>
          <span>${label}</span>
        `;

        actionButton.setAttribute(
          "aria-label",
          label
        );
      }


      function setARMode() {

        arAvailable = true;

        actionButton.className =
          "action-button ar-available";

        actionButton.innerHTML =
          arIcon +
          "<span>View in AR</span>";

        actionButton.setAttribute(
          "aria-label",
          "View sculpture in Augmented Reality"
        );

        actionButton.disabled = false;
      }


      function setModelOnlyMode() {

        arAvailable = false;

        actionButton.className =
          "action-button model-only";

        actionButton.innerHTML =
          modelIcon +
          "<span>View 3D Model</span>";

        actionButton.setAttribute(
          "aria-label",
          "View and rotate 3D sculpture"
        );

        actionButton.disabled = false;
      }


      /* ========================================
         INFORMATION MESSAGE
         ======================================== */

      function showArInformation(
        title,
        text,
        footnote
      ) {

        arInfoTitle.textContent =
          title || "AR Unavailable";

        arInfoText.textContent =
          text ||
          "Augmented Reality is not available on this device.";

        arInfoFootnote.textContent =
          footnote ||
          "You can still rotate and zoom the sculpture using the 3D viewer.";

        arInfoMessage.style.display =
          "block";
      }


      function hideArInformation() {

        arInfoMessage.style.display =
          "none";
      }


      /* ========================================
         ERROR
         ======================================== */

      function showModelError(message) {

        errorText.textContent =
          message;

        errorMessage.style.display =
          "block";

        actionButton.style.display =
          "none";
      }


      /* ========================================
         AR CAPABILITY
         ======================================== */

      function evaluateARCapability() {

        /*
         * Important:
         *
         * canActivateAR is the capability check
         * provided by model-viewer.
         *
         * We do NOT decide AR support by:
         *
         *   - Android version
         *   - iPhone model
         *   - user-agent alone
         *
         * model-viewer knows which AR mode can
         * actually be used.
         */

        const capability =
          modelViewer.canActivateAR;


        if (typeof capability !== "boolean") {

          return false;
        }


        arAvailable =
          capability;


        if (capability) {

          setARMode();

        } else {

          setModelOnlyMode();
        }


        return true;
      }


      function scheduleARCapabilityCheck() {

        if (capabilityTimer) {

          clearTimeout(
            capabilityTimer
          );
        }


        /*
         * First attempt.
         */

        capabilityTimer =
          setTimeout(() => {

            if (evaluateARCapability()) {

              return;
            }


            /*
             * Some environments need a little
             * more time before canActivateAR
             * becomes meaningful.
             */

            capabilityTimer =
              setTimeout(() => {

                evaluateARCapability();

              }, 1200);

          }, 300);
      }


      /* ========================================
         INITIAL DEBUG
         ======================================== */

      console.log(
        "[AR Sculpture] Starting"
      );

      console.log(
        "[Environment]",
        {
          secureContext: isSecure,
          webGL: hasWebGL,
          android: isAndroid,
          iOS: isIOS,
          inAppBrowser: isInAppBrowser,
          userAgent: ua
        }
      );


      /* ========================================
         PRE-FLIGHT
         ======================================== */

      if (!hasWebGL) {

        showModelError(
          "WebGL is disabled or not supported by this browser. " +
          "Please enable hardware acceleration or use a modern browser."
        );

        return;
      }


      /*
       * HTTPS is particularly important for WebXR.
       *
       * We don't immediately disable the 3D viewer.
       */

      if (!isSecure) {

        const note =
          document.createElement("div");

        note.className =
          "environment-note";

        note.textContent =
          "For the best AR compatibility, open this page using HTTPS.";

        document.body.appendChild(
          note
        );

      }


      /* ========================================
         MODEL LOAD TIMEOUT
         ======================================== */

      loadTimeout =
        setTimeout(() => {

          if (!modelLoaded) {

            showModelError(
              "The sculpture took too long to load. " +
              "Check your connection and make sure escultura.glb exists."
            );

          }

        }, 15000);


      /* ========================================
         MODEL LOADED
         ======================================== */

      modelViewer.addEventListener(
        "load",
        () => {

          clearTimeout(
            loadTimeout
          );

          modelLoaded = true;

          console.log(
            "[Model] Loaded successfully."
          );

          /*
           * Do NOT call activateAR here.
           *
           * AR must be launched from the user's
           * button click.
           */

          scheduleARCapabilityCheck();

        }
      );


      /* ========================================
         MODEL ERROR
         ======================================== */

      modelViewer.addEventListener(
        "error",
        (event) => {

          clearTimeout(
            loadTimeout
          );

          console.error(
            "[Model Error]",
            event
          );

          showModelError(
            "The file escultura.glb could not be loaded. " +
            "Make sure the file exists at ./escultura.glb."
          );

        }
      );


      /* ========================================
         AR BUTTON
         ======================================== */

      actionButton.addEventListener(
        "click",
        async () => {

          /*
           * Don't do anything while model is loading.
           */

          if (!modelLoaded) {

            return;
          }


          /*
           * If AR isn't available, explain why
           * instead of pretending the button works.
           */

          if (!arAvailable) {

            if (isInAppBrowser) {

              showArInformation(

                "Open in Your Browser",

                "AR may be blocked inside this app. " +
                "Open this page in Safari or Chrome to launch AR.",

                "The 3D sculpture is still available here."
              );

            } else {

              showArInformation(

                "AR Unavailable",

                "This browser or device cannot start an AR experience for this model.",

                "You can still rotate and zoom the sculpture using the 3D viewer."
              );
            }

            return;
          }


          /*
           * Prevent multiple activations.
           */

          if (arStarted) {

            return;
          }


          arStarted = true;


          /*
           * IMPORTANT:
           *
           * activateAR() is called directly from
           * the user's click handler.
           *
           * This is intentional.
           */

          setLoading(
            "Activating..."
          );


          try {

            console.log(
              "[AR] Calling activateAR()..."
            );


            await modelViewer.activateAR();


            console.log(
              "[AR] Activation requested."
            );

          }

          catch (error) {

            console.error(
              "[AR] activateAR() failed",
              error
            );

            arStarted = false;

            setARMode();


            if (isInAppBrowser) {

              showArInformation(

                "Open in Your Browser",

                "This app's built-in browser may prevent AR from opening. " +
                "Open the page in Chrome or Safari.",

                "The 3D sculpture remains available here."
              );

            }

            else if (isAndroid) {

              showArInformation(

                "Could Not Start AR",

                "AR is supported, but the AR experience could not be started. " +
                "Make sure Google Play Services for AR is installed and updated.",

                "You can still rotate and zoom the sculpture here."
              );

            }

            else if (isIOS) {

              showArInformation(

                "Could Not Start AR",

                "AR could not be started. " +
                "Try opening this page directly in Safari and make sure escultura.usdz is available.",

                "You can still rotate and zoom the sculpture here."
              );

            }

            else {

              showArInformation(

                "Could Not Start AR",

                "The device reported AR support, but the AR session could not be started.",

                "You can still rotate and zoom the sculpture here."
              );
            }
          }

        }
      );


      /* ========================================
         AR STATUS
         ======================================== */

      modelViewer.addEventListener(
        "ar-status",
        (event) => {

          const status =
            event.detail &&
            event.detail.status;


          console.log(
            "[AR Status]",
            status
          );


          switch (status) {


            case "session-started":

              /*
               * Native AR / WebXR session has started.
               */

              console.log(
                "[AR] Session started."
              );

              break;


            case "object-placed":

              console.log(
                "[AR] Object placed."
              );

              break;


            case "failed":

              /*
               * The device/browser reported that
               * the AR session failed.
               */

              console.error(
                "[AR] Session failed."
              );

              arStarted = false;

              setARMode();


              if (isInAppBrowser) {

                showArInformation(

                  "Open in Your Browser",

                  "AR could not start inside this app. " +
                  "Open the page in Chrome or Safari.",

                  "The 3D sculpture remains available here."
                );

              }

              else {

                showArInformation(

                  "AR Session Failed",

                  "The device could not start the AR session. " +
                  "Try again using the latest version of your browser.",

                  "You can still rotate and zoom the sculpture here."
                );
              }

              break;


            case "not-presenting":

              /*
               * User left AR and returned to
               * the normal 3D viewer.
               */

              console.log(
                "[AR] Session ended."
              );

              arStarted = false;

              if (arAvailable) {

                setARMode();

              } else {

                setModelOnlyMode();
              }

              break;

          }

        }
      );


      /* ========================================
         CLOSE MESSAGE
         ======================================== */

      closeInfoButton.addEventListener(
        "click",
        hideArInformation
      );


      /* ========================================
         RELOAD
         ======================================== */

      reloadButton.addEventListener(
        "click",
        () => {

          window.location.reload();

        }
      );


      /* ========================================
         ESCAPE
         ======================================== */

      document.addEventListener(
        "keydown",
        (event) => {

          if (event.key === "Escape") {

            hideArInformation();
          }

        }
      );


    })();

  </script>

</body>

</html>
